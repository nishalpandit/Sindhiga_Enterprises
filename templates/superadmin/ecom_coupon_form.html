{% extends 'superadmin/base.html' %}

{% block title %}Create Coupon - Sindhiga Admin{% endblock %}
{% block header_title %}Create New Promotional Coupon{% endblock %}

{% block content %}
<div style="margin-bottom: 20px;">
  <a href="{% url 'super_admin_ecom_coupons' %}" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none;">
    <i class="fa-solid fa-arrow-left"></i> Back to Coupons
  </a>
</div>

<div class="card" style="max-width: 600px; padding: 24px;">
  <form method="POST" style="display: flex; flex-direction: column; gap: 16px;">
    {% csrf_token %}

    <div>
      <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--text-main); margin-bottom: 6px;">Coupon Code *</label>
      <input type="text" name="code" required placeholder="e.g. WELCOME50, SINDHIGA10" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 14px; text-transform: uppercase; font-family: monospace; font-weight: 800; outline: none;">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
      <div>
        <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--text-main); margin-bottom: 6px;">Discount Type</label>
        <select name="discount_type" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 13px; outline: none;">
          <option value="PERCENTAGE">Percentage (%)</option>
          <option value="FLAT">Flat Amount (₹)</option>
        </select>
      </div>

      <div>
        <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--text-main); margin-bottom: 6px;">Discount Value *</label>
        <input type="number" step="0.01" name="discount_value" required placeholder="e.g. 10 or 50.00" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 13px; outline: none;">
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
      <div>
        <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--text-main); margin-bottom: 6px;">Minimum Order Value (₹)</label>
        <input type="number" step="0.01" name="min_order_value" value="0" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 13px; outline: none;">
      </div>

      <div>
        <label style="display: block; font-size: 12.5px; font-weight: 700; color: var(--text-main); margin-bottom: 6px;">Valid Until</label>
        <input type="date" name="valid_to" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 13px; outline: none;">
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
      <input type="checkbox" name="is_active" id="id_is_active" checked>
      <label for="id_is_active" style="font-size: 13px; font-weight: 600; color: var(--text-main); cursor: pointer;">Enable coupon immediately</label>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 12px;">
      <button type="submit" class="btn btn-primary" style="background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: var(--r-sm); font-weight: 700; cursor: pointer;">
        Save Coupon
      </button>
      <a href="{% url 'super_admin_ecom_coupons' %}" class="btn btn-outline" style="padding: 10px 18px; border: 1px solid var(--border); border-radius: var(--r-sm); font-weight: 600; color: var(--text-muted); text-decoration: none;">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
